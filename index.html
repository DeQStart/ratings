<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог фильмов</title>
  <style>
    body {
      background-color: #0b0f15;
      color: #e0e0e0;
      font-family: sans-serif;
      padding: 24px;
      margin: 0;
    }

    #movies-container {
      display: grid;
      /* На больших экранах — по 3, на средних — по 2, на мобильных — по 1 */
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background-color: #141a25;
      border: 1px solid #2a364d;
      padding: 18px;
      max-width: 520px;      /* чтобы на больших экранах карточка не растягивалась бесконечно */
      position: relative;
      border-radius: 8px;
    }

    .movie-title {
      margin: 0 0 8px 0;
      font-size: 1.25em;
      color: #ffffff;
      line-height: 1.3;
    }

    /* Базовый стиль бейджа */
    .rating-badge {
      display: inline-block;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.15em;
      padding: 6px 12px;
      text-align: center;
      min-width: 48px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
      box-sizing: border-box;
    }

    /* Зелёный: рейтинг 7 и выше */
    .rating-good {
      background: #2ecc71;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.35);
    }

    /* Серый: рейтинг от 5 до 6.9 */
    .rating-neutral {
      background: #5a6b7d;
      box-shadow: 0 0 6px rgba(90, 107, 125, 0.3);
    }

    /* Красный: рейтинг ниже 5 */
    .rating-bad {
      background: #ff4459;
      box-shadow: 0 0 8px rgba(255, 68, 89, 0.4);
    }

    .movie-year {
      color: #8a9bc2;
      font-size: 0.9em;
      margin-top: 6px;
    }

    .hint {
      color: #6c80a0;
      font-size: 0.85em;
      margin-top: 16px;
      line-height: 1.3;
    }

    button.rate-btn {
      background: #1f2a40;
      color: #00ff88;
      border: 1px solid #00ff88;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 12px;
      transition: all 0.2s ease;
    }

    button.rate-btn:hover {
      background: #00ff88;
      color: #0b0f15;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.45);
    }
    .meta-row {
  color: #8a9bc2;
  font-size: 0.88em;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.meta-label {
  color: #6c80a0;
  margin-right: 6px;
}

.platforms-row {
  margin-top: 12px;
}
.platform-tag {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 16px;
  font-size: 0.85em;
  font-weight: 600;
  color: #0b0f15;
  margin-right: 8px;
  margin-bottom: 6px;
}
/* Цвета платформ */
.tag-ivi { background-color: #ff5f81; }       /* Иви — красно-розовый */
.tag-kinopoisk { background-color: #ff9900; }
.tag-wink { background-color: #3b8bff; }
.tag-okko { background-color: #ff6b00; }
.tag-start { background-color: #4caf50; }
.tag-premier { background-color: #d32f2f; }
.tag-kion { background-color: #9c27b0; }
  </style>
</head>
<body>

  <div id="movies-container"></div>

  <script>
    const movies = [
      {

      },
      {

      },
      {

      },
      {
        id: 'card-lackey',
        title: 'Холоп',
        year: 2019,
        avgRating: 10.0,
        director: 'Клим Шипенко',
        producer: 'Yellow, Black and White',
        actors: ['Милош Бикович', 'Александра Бортич', 'Иван Охлобыстин'],
        platforms: ['ivi', 'okko', 'kinopoisk'],
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
        id: 'card-firs',
        title: 'Ёлки',
        year: 2010,
        avgRating: 7.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
        id: 'card-firs-2',
        title: 'Ёлки 2',
        year: 2011,
        avgRating: 8.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-firs-3',
        title: 'Ёлки 3',
        year: 2013,
        avgRating: 7.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-firs-1914',
        title: 'Ёлки 1914',
        year: 2014,
        avgRating: 6.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-firs-5',
        title: 'Ёлки 5',
        year: 2016,
        avgRating: 6.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-new-firs',
        title: 'Ёлки новые',
        year: 2017,
        avgRating: 7.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-the-last-firs',
        title: 'Ёлки Последние',
        year: 2018,
        avgRating: 7.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-firs-8',
        title: 'Ёлки 8',
        year: 2021,
        avgRating: 3.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-firs-9',
        title: 'Ёлки 9',
        year: 2022,
        avgRating: 5.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      {
     id: 'card-firs-10',
        title: 'Ёлки 10',
        year: 2023,
        avgRating: 4.0,
        feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeEJlJtWK-VO7J24B_wNIXdMRDBO3jrgTScBNtbwmsc2wiGYg/viewform?usp=publish-editor'
      },
      // Сюда можно добавлять ещё фильмы
    ];

    function getRatingClass(rating) {
      if (rating < 5) {
        return 'rating-bad';
      } else if (rating < 7) {
        return 'rating-neutral';
      } else {
        return 'rating-good';
      }
    }

    function render() {
      const container = document.getElementById('movies-container');
      if (!container) return;

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.id = movie.id;
        card.className = 'movie-card';

        // Заголовок
        const title = document.createElement('h3');
        title.className = 'movie-title';
        title.textContent = movie.title;
        card.appendChild(title);

        // Рейтинг с динамическим цветом
        const ratingBadge = document.createElement('div');
        ratingBadge.className = `rating-badge ${getRatingClass(movie.avgRating)}`;
        ratingBadge.textContent = movie.avgRating.toFixed(1);
        card.appendChild(ratingBadge);

        // Год
        const year = document.createElement('div');
        year.className = 'movie-year';
        year.textContent = '(' + movie.year + ')';
        card.appendChild(year);

        // Подсказка
        const info = document.createElement('div');
        info.className = 'hint';
        info.textContent = 'Хочешь оценить? Напиши в группу — администратор обновит рейтинг вручную.';
        card.appendChild(info);

        // Кнопка
        const btn = document.createElement('button');
        btn.className = 'rate-btn';
        btn.textContent = 'Поставить оценку';
        btn.onclick = () => {
          if (!movie.feedbackUrl || movie.feedbackUrl.includes('твоя_')) {
            alert('Ссылка на группу ещё не настроена!');
            return;
          }
          window.open(movie.feedbackUrl, '_blank');
        };
        card.appendChild(btn);

        container.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
