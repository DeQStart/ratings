<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог фильмов</title>
  <style>
    body {
      background-color: #0b0f15;
      color: #e0e0e0;
      font-family: sans-serif;
      padding: 24px;
      margin: 0;
    }

    #movies-container, #actors-container {
      display: grid;
      /* На больших экранах — по 3, на средних — по 2, на мобильных — по 1 */
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background-color: #141a25;
      border: 1px solid #2a364d;
      padding: 18px;
      max-width: 520px;      /* чтобы на больших экранах карточка не растягивалась бесконечно */
      position: relative;
      border-radius: 8px;
    }

    .movie-title {
      margin: 0 0 8px 0;
      font-size: 1.25em;
      color: #ffffff;
      line-height: 1.3;
    }

    /* Базовый стиль бейджа */
    .rating-badge {
      display: inline-block;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.15em;
      padding: 6px 12px;
      text-align: center;
      min-width: 48px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
      box-sizing: border-box;
    }

/* Золотой бейдж для рейтинга выше 8.5 */
.rating-vip {
  background: linear-gradient(135deg, #f5e6c0 0%, #d4a530 100%);
  color: #000000;
  border: 2px solid #4a331e;
  box-shadow: 0 0 12px rgba(212, 165, 48, 0.45);
  position: relative;
  z-index: 2;
}

/* Декоративные «злаки» по бокам */
.rating-vip::before,
.rating-vip::after {
  content: "🌾";
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #000000;
  font-size: 1.1em;
  display: block;
}
.rating-vip::before {
  left: -18px;
}
.rating-vip::after {
  right: -18px;
}


    /* Зелёный: рейтинг 7 и выше */
    .rating-good {
      background: #2ecc71;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.35);
    }

    /* Серый: рейтинг от 5 до 6.9 */
    .rating-neutral {
      background: #5a6b7d;
      box-shadow: 0 0 6px rgba(90, 107, 125, 0.3);
    }

    /* Красный: рейтинг ниже 5 */
    .rating-bad {
      background: #ff4459;
      box-shadow: 0 0 8px rgba(255, 68, 89, 0.4);
    }

    .movie-year {
      color: #8a9bc2;
      font-size: 0.9em;
      margin-top: 6px;
    }

    .hint {
      color: #6c80a0;
      font-size: 0.85em;
      margin-top: 16px;
      line-height: 1.3;
    }

    button.rate-btn {
      background: #1f2a40;
      color: #00ff88;
      border: 1px solid #00ff88;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 12px;
      transition: all 0.2s ease;
    }

    button.rate-btn:hover {
      background: #00ff88;
      color: #0b0f15;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.45);
    }
    .meta-row {
  color: #8a9bc2;
  font-size: 0.88em;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.meta-label {
  color: #6c80a0;
  margin-right: 6px;
}

.platforms-row {
  margin-top: 12px;
}
.platform-tag {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 16px;
  font-size: 0.85em;
  font-weight: 600;
  color: #ffffff;               /* белый текст на всех тегах */
  margin-right: 8px;
  margin-bottom: 6px;
}

.tag-ivi { background-color: #ff0061; }           /* Иви */
.tag-kinopoisk { background-color: #d35f00; }    /* КиноПоиск */
.tag-wink { background-color: #ff8c00; }         /* Wink */
.tag-okko { background-color: #4b0082; }         /* Okko */
.tag-start {
  background: linear-gradient(135deg, #4b0000 0%, #9b111e 100%);
  color: #ffffff;
  /* можно добавить лёгкое свечение, если хочется эффектнее */
  box-shadow: 0 2px 6px rgba(155, 17, 30, 0.4);
}
        /* START */
.tag-kion { background-color: #c71585; }          /* КИОН */
.tag-premier { background-color: #b88f00; }     /* Premier */
.tag-sts {
  background-color: #FFD700;   /* насыщенный жёлтый */
  color: #000000;              /* чёрный текст */
}
.tag-ntv { background-color: #1a881a; }
.tag-smotrim {
  background: linear-gradient(135deg, #3b1f4f 0%, #5e1e3a 100%);
  color: #ffffff;
  padding: 4px 10px;
  border-radius: 16px;
  font-size: 0.85em;
  font-weight: 600;
  margin-right: 8px;
  margin-bottom: 6px;
  display: inline-block;
  box-shadow: 0 2px 6px rgba(94, 30, 58, 0.35);
}

  </style>

function formatDate(dateString) {
  if (!dateString) return '';
  const d = new Date(dateString);
  if (isNaN(d.getTime())) return '';
  return `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getFullYear()}`;
}

function getRatingClass(rating) {
  if (movie.isVip) return 'rating-vip';

  const rating = movie.AvgRating;
  if (rating === 0) return 'rating-neutral';
  if (rating > 8.5) return 'rating-vip';
  if (rating < 5) return 'rating-bad';
  if (rating < 7) return 'rating-neutral'
  return 'rating-good';
}

function renderMovies(list) {
  const container = document.getElementById('movies-container');
  if (!container) return;
  container.innerHTML = ''; // очищаем перед отрисовкой

  list.forEach(movie => {
    const card = document.createElement('div');
    card.id = movie.id;
    card.className = 'movie-card';

    // Заголовок
    const title = document.createElement('h3');
    title.className = 'movie-title';
    title.textContent = movie.title;
    card.appendChild(title);

    // Рейтинг с цветом
    const ratingBadge = document.createElement('div');
    ratingBadge.className = `rating-badge ${getRatingClass(movie)}`;
    ratingBadge.textContent = movie.avgRating.toFixed(1);
    card.appendChild(ratingBadge);

    // Год
    const year = document.createElement('div');
    year.className = 'movie-year';
    year.textContent = '(' + movie.year + ')';
    card.appendChild(year);

    // Метаданные (режиссёр, продюсер, актёры)
    if (movie.director || movie.producer || (movie.actors && movie.actors.length)) {
      const metaContainer = document.createElement('div');
      if (movie.director) {
        const row = document.createElement('div');
        row.className = 'meta-row';
        row.innerHTML = `<span class="meta-label">Режиссёр:</span> ${movie.director}`;
        metaContainer.appendChild(row);
      }
      if (movie.producer) {
        const row = document.createElement('div');
        row.className = 'meta-row';
        row.innerHTML = `<span class="meta-label">Продюсер:</span> ${movie.producer}`;
        metaContainer.appendChild(row);
      }
      if (movie.actors && movie.actors.length) {
        const row = document.createElement('div');
        row.className = 'meta-row';
        row.innerHTML = `<span class="meta-label">В ролях:</span> ${movie.actors.join(', ')}`;
        metaContainer.appendChild(row);
      }
      card.appendChild(metaContainer);
    }

    // Платформы
    if (movie.platforms && movie.platforms.length) {
      const platformsRow = document.createElement('div');
      platformsRow.className = 'platforms-row';
      movie.platforms.forEach(platform => {
        const tag = document.createElement('span');
        tag.className = `platform-tag tag-${platform}`;
        if (platform === 'sts') {
  tag.textContent = 'СТС';
  } else if (platform === 'ivi') {
    tag.textContent = 'ИВИ';
          } else if (platform === 'kion') {
    tag.textContent = 'КИОН';
          } else if (platform === 'ntv') {
    tag.textContent = 'НТВ';
          } else if (platform === 'smotrim') {
    tag.textContent = 'СМОТРИМ';
      } else {
  tag.textContent = platform.toUpperCase();
        }
        platformsRow.appendChild(tag);
      });
      card.appendChild(platformsRow);
    }

    // Подсказка
    const info = document.createElement('div');
    info.className = 'hint';
    info.textContent = 'Хочешь оценить? Нажми на кнопку ниже, она перешлёт тебя в Гугл Форму';
    card.appendChild(info);

    // Кнопка
    const btn = document.createElement('button');
    btn.className = 'rate-btn';
    btn.textContent = 'Поставить оценку';
    btn.onclick = () => {
      if (!movie.feedbackUrl || movie.feedbackUrl.includes('твоя_')) {
        alert('Ссылка на группу ещё не настроена!');
        return;
      }
      window.open(movie.feedbackUrl, '_blank');
    };
    card.appendChild(btn);

    container.appendChild(card);
  });
}

// Функция сортировки
function sortMovies(arr, type) {
  const copy = [...arr];
  if (type === 'rating-asc') {
    return copy.sort((a, b) => (a.avgRating ?? 0) - (b.avgRating ?? 0));
  } else if (type === 'rating-desc') {
    return copy.sort((a, b) => (b.avgRating ?? 0) - (a.avgRating ?? 0));
  }
  return copy; // без сортировки
}

// Обработчик сортировки
const sortSelect = document.getElementById('sort-select');
if (sortSelect) {
  sortSelect.addEventListener('change', (e) => {
    const sortType = e.target.value;
    const sorted = sortMovies(movies, sortType);
    renderMovies(sorted);
  });
}
    function toggleView() {
  const viewToggle = document.getElementById('view-toggle');
  const moviesContainer = document.getElementById('movies-container');
  const actorsContainer = document.getElementById('actors-container');

  if (viewToggle.dataset.mode === 'actors') {
    // Показываем фильмы, скрываем актёров
    viewToggle.dataset.mode = 'movies';
    viewToggle.textContent = 'Переключить: Актёры';

    actorsContainer.style.display = 'none';
    moviesContainer.style.display = 'grid'; // явно ставим grid

    renderMovies(movies); // заново рисуем фильмы — это заставит Grid пересчитаться
  } else {
    // Показываем актёров, скрываем фильмы
    viewToggle.dataset.mode = 'actors';
    viewToggle.textContent = 'Переключить: Фильмы';

    moviesContainer.style.display = 'none';
    actorsContainer.style.display = 'grid'; // явно ставим grid

    renderActors(); // рисуем актёров
  }
    }

document.getElementById('view-toggle').addEventListener('click', toggleView);

document.getElementById('view-toggle').dataset.mode = 'movies';

// Первоначальная отрисовка
renderMovies(movies);
    function renderActors() {
  const container = document.getElementById('actors-container');
  if (!container) return;
  container.innerHTML = '';

  actorsList.forEach(actor => {
    const card = document.createElement('div');
    card.className = 'movie-card'; // используем тот же стиль карточки
    card.style.maxWidth = '400px';

    const name = document.createElement('h3');
    name.className = 'movie-title';
    name.textContent = actor.name;
    card.appendChild(name);

    const details = document.createElement('div');
    details.style.color = '#8a9bc2';
    details.style.fontSize = '0.9em';
    details.style.lineHeight = '1.5';

    // Дата рождения
    if (actor.birth) {
      const d = new Date(actor.birth);
      details.textContent += `Родился: ${formatDate(actor.birth)}`;
    }

    // Дата смерти
    if (actor.death) {
  details.textContent += '\nУмер: ' + formatDate(actor.death);
    }

    // Рост
    if (actor.height) {
      details.textContent += `Рост: ${actor.height} см`;
    }

    card.appendChild(details);
    container.appendChild(card);
  });
    }
